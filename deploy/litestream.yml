# Litestream replicates only WAL-mode databases; `openDb` sets that pragma on every open here.
#
# `dbs[].path` has no wildcard, so every mind is named. A child born in play gets a mind db that
# is NOT in this file and is therefore NOT backed up — add a block for it.

dbs:
  # The world, plus the forge's asset and vision_qa tables: `openForgeDb` is handed this path.
  - path: /data/dev-world.db
    replicas:
      - type: s3
        bucket: $LITESTREAM_BUCKET
        path: san-junipero/dev-world
        region: $LITESTREAM_REGION
        endpoint: $LITESTREAM_ENDPOINT
        retention: 168h
        snapshot-interval: 6h

  # The call ledger. The $5 anomaly stop is per TOWN, not per process: restore a world without
  # its ledger and the new box gets a fresh $5 to spend.
  - path: /data/minds/_ops.db
    replicas:
      - type: s3
        bucket: $LITESTREAM_BUCKET
        path: san-junipero/minds/_ops
        region: $LITESTREAM_REGION
        endpoint: $LITESTREAM_ENDPOINT
        retention: 168h
        snapshot-interval: 6h

  # The minds. Their loss does not announce itself as an error: restore them with the world.
  - path: /data/minds/amara.db
    replicas:
      - type: s3
        bucket: $LITESTREAM_BUCKET
        path: san-junipero/minds/amara
        region: $LITESTREAM_REGION
        endpoint: $LITESTREAM_ENDPOINT
        retention: 168h
        snapshot-interval: 6h
  - path: /data/minds/yusuf.db
    replicas:
      - type: s3
        bucket: $LITESTREAM_BUCKET
        path: san-junipero/minds/yusuf
        region: $LITESTREAM_REGION
        endpoint: $LITESTREAM_ENDPOINT
        retention: 168h
        snapshot-interval: 6h
  - path: /data/minds/nadia.db
    replicas:
      - type: s3
        bucket: $LITESTREAM_BUCKET
        path: san-junipero/minds/nadia
        region: $LITESTREAM_REGION
        endpoint: $LITESTREAM_ENDPOINT
        retention: 168h
        snapshot-interval: 6h
  - path: /data/minds/omar.db
    replicas:
      - type: s3
        bucket: $LITESTREAM_BUCKET
        path: san-junipero/minds/omar
        region: $LITESTREAM_REGION
        endpoint: $LITESTREAM_ENDPOINT
        retention: 168h
        snapshot-interval: 6h
  - path: /data/minds/salma.db
    replicas:
      - type: s3
        bucket: $LITESTREAM_BUCKET
        path: san-junipero/minds/salma
        region: $LITESTREAM_REGION
        endpoint: $LITESTREAM_ENDPOINT
        retention: 168h
        snapshot-interval: 6h
