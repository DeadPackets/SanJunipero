# The golden-replay test has no job of its own: `replayFromGenesis` is asserted from inside the
# ordinary suite, so a separate job would run the same assertions twice and drift.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # Queued duplicates are what make a slow CI a bypassed CI.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No OPENROUTER_API_KEY or IMAGE_PROVIDER_KEY anywhere in this file, deliberately: with no key
  # in the environment there is no path from a green build to a bill. Never add one as a secret.
  CI: "true"

jobs:
  gate:
    runs-on: ubuntu-latest
    # Room for a cold pnpm store and a bad runner, without ever hanging an hour.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      # better-sqlite3 and sharp resolve prebuilds for linux/x64, so no build-essential is needed.
      - name: install
        run: pnpm install --frozen-lockfile

      # typecheck (both halves — the scripts projects are separate and have broken on their own
      # before), then lint, format, knip and the suite. The vitest flags that keep this suite
      # honest live in vitest.config.ts now, so a local run gets them too.
      - name: check
        run: pnpm check

      # vite's `build.assetsDir` and the gateway's `CLIENT_ASSET_DIR` must name the same
      # directory; if they drift the viewer 404s on its own scripts with a green suite.
      - name: build the viewer
        run: pnpm --filter @sj/web build

      - name: the built client is where the server looks for it
        run: |
          test -f packages/web/dist/index.html
          test -d packages/web/dist/client
          grep -q '/client/' packages/web/dist/index.html

      # Build only: nothing is pushed, and there are no registry credentials in this workflow.
      - name: the image still builds
        run: docker build -t san-junipero:ci .

      - name: the deployment files are valid
        run: docker compose config --quiet
