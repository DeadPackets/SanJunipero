# No `scale:` — each container ticks its own world from its own sqlite file, so a second replica
# is a second town, not more capacity.
#
# The mount must be the PARENT `data` directory, not the world file: these paths are relative in
# the code (DEV_DB_PATH, STREAM_MINDS_DIR) and resolve against /app/packages/gateway.
#
#   data/dev-world.db   the world + the forge's asset and vision_qa tables
#   data/minds/*.db     one per mind: memories, journal, half-run plan
#   data/minds/_ops.db  the call ledger the daily budget and the lifetime cap are read off
#
# Cover the world and miss `minds/` and the town comes back healthy with every person blank —
# announced on one stdout line, never an error, and invisible in the viewer.
services:
  town:
    build: .
    # Loopback, not 0.0.0.0: Caddy answers the internet. Reachable on the box so an operator can
    # tell "the town is down" apart from "TLS is down".
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      # Ring 3 is a 152-tile square, ring 1 the 76-tile showcase. Changing it on a running town
      # refuses the boot; a new ring count needs a new town (SJ_FRESH=1).
      - SJ_RINGS=${SJ_RINGS:-1}
      - SJ_INTERIORS=${SJ_INTERIORS:-0}
      # Named with NO value: compose reads `.env` and passes these on only when they are SET, so
      # an unset knob keeps the code's own default. Written as `${SJ_LAMPS:-}` it would arrive as
      # an empty string, and `Number('')` is 0 — an unlit town nobody asked for.
      - SJ_MAP
      - SJ_LAMPS
      - SJ_LIVE
      - SJ_ARBITER
      - SJ_SPEND_DAILY_USD
      - SJ_SPEND_CAP_USD
      - SJ_MINDS_DIR
      - SJ_MODELS_DIR
      - OPENROUTER_API_KEY
      # Hard-coded, never `${SJ_FRESH:-0}` and never a bare pass-through: a stray SJ_FRESH=1 in
      # `.env` would then delete the world on every restart. A reset is one explicit run:
      # `compose run --rm -e SJ_FRESH=1 town`.
      - SJ_FRESH=0
      - NODE_OPTIONS=--enable-source-maps
    volumes:
      # The whole `data` directory, not the world file inside it — see the header.
      # `docker compose down -v` is the deliberate way to end a town.
      - town-data:/app/packages/gateway/data
    restart: unless-stopped
    stop_grace_period: 20s
    # There is no metrics endpoint: a lagging viewer is reported only as a stderr line. Rotation
    # is capped so a month of streaming cannot fill the disk and take the town down.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # `/api/timeline/marks` answers only once the world mirror has folded a state, so it
      # reports the WORLD being up rather than the port being open.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/timeline/marks').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    # Sized around `assetsHttp`'s `encoded` Map, which never shrinks, so the floor rises with the
    # population. Raise it, never remove it: no limit means the OOM killer takes the whole box.
    mem_limit: 1g

  caddy:
    image: caddy:2-alpine
    depends_on:
      - town
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      # A hostname here turns on real TLS; `:80` keeps it plain HTTP for a local run. See
      # deploy/Caddyfile — this is the only knob.
      SJ_SITE_ADDRESS: "${SJ_SITE_ADDRESS:-:80}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates must survive a restart: Let's Encrypt allows 5 issuances per hostname per
      # week, so without this volume the fifth `compose up` in a week leaves the site with no TLS.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Behind a profile so a box with no S3 credentials still comes up instead of restart-looping.
  # `docker compose --profile backup up -d` turns on continuous backup.
  litestream:
    profiles: ["backup"]
    image: litestream/litestream:0.3.13
    depends_on:
      - town
    # The credential check runs in the container, not as `${LITESTREAM_BUCKET:?...}`: compose
    # interpolates every service before applying profiles, so that form breaks a plain `up`.
    entrypoint: ["/bin/sh", "/etc/litestream.sh"]
    environment:
      # Never written into this file or the image — see deploy/.env.example.
      LITESTREAM_ACCESS_KEY_ID: "${LITESTREAM_ACCESS_KEY_ID:-}"
      LITESTREAM_SECRET_ACCESS_KEY: "${LITESTREAM_SECRET_ACCESS_KEY:-}"
      LITESTREAM_BUCKET: "${LITESTREAM_BUCKET:-}"
      LITESTREAM_REGION: "${LITESTREAM_REGION:-us-east-1}"
      LITESTREAM_ENDPOINT: "${LITESTREAM_ENDPOINT:-}"
    volumes:
      - ./deploy/litestream.sh:/etc/litestream.sh:ro
      # Not `:ro` on purpose: litestream writes a shadow WAL beside each database, and read-only
      # it replicates nothing while looking healthy.
      - town-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  town-data:
  caddy-data:
  caddy-config:
