# One shared world, many viewers. There is deliberately no `scale:` here — a second replica is
# a SECOND TOWN, not more capacity for this one, because each container ticks its own world from
# its own sqlite file. Serving more viewers means a bigger box or a CDN, never another replica.
services:
  town:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # How far the town is platted. Ring 3 is a 152-tile square and is the case the chunked
      # ground was written for; ring 1 is the 76-tile showcase.
      #
      # ★ CHANGING THIS ON A RUNNING TOWN NOW REFUSES THE BOOT rather than rendering one map
      # while simulating another. Either keep the ring count the town was founded with, or ask
      # for a new town with SJ_FRESH=1.
      SJ_RINGS: "${SJ_RINGS:-1}"
      SJ_INTERIORS: "${SJ_INTERIORS:-0}"
      # ★ 1 THROWS THE TOWN AWAY AND STARTS A NEW DAY 0. Leave it 0 and `restart` below brings
      # back the town that was running, at the tick it stopped on.
      SJ_FRESH: "${SJ_FRESH:-0}"
    volumes:
      # ★ THIS IS WHAT KEEPS THE TOWN. The world db lives here, `startDevWorld` resumes from it
      # instead of deleting it, and `restart` below therefore brings back the same town — same
      # buildings, same people, same day — rather than a new one at day 0.
      # `docker compose down -v` is the deliberate way to end a town.
      - town-data:/app/packages/gateway/data
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      # `/api/timeline/marks` answers only once the world mirror has folded a state, so it
      # reports the WORLD being up rather than the port being open.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/timeline/marks').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  town-data:
