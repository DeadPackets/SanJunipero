<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>San Junipero — a small town, watched kindly</title>
    <meta
      name="description"
      content="A town of minds that live their own days, watched kindly. Watch it live, read its record, and follow anyone in it."
    />
    <meta name="theme-color" content="#322B38" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      /* The first frame, inline so it paints on the first byte and is what LCP measures. It
         names no webfont: Georgia is Fraunces' own fallback, so the card never waits or reflows. */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #322b38;
      }
      .first-frame,
      .no-script {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.75rem;
        padding: 6vmin;
        background: #322b38;
        text-align: center;
      }
      .first-frame {
        z-index: 40;
        /* the `scene` motion, in the one place the sheet cannot reach (ui/motion.ts) */
        transition: opacity 300ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .no-script {
        z-index: 41;
      }
      .first-frame h1,
      .no-script h1 {
        margin: 0;
        font: 500 clamp(28px, 6vw, 44px) / 1.1 Georgia, 'Times New Roman', serif;
        letter-spacing: -0.01em;
        color: #fff6e9;
      }
      .first-frame p,
      .no-script p {
        margin: 0;
        max-width: 42ch;
        font: 400 16px / 1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #c4b8ae;
        text-wrap: pretty;
      }
      .no-script a {
        color: #f2c879;
      }
      .first-frame.gone {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .first-frame {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="first-frame" id="first-frame">
        <h1>San Junipero</h1>
        <p id="first-frame-note" role="status">Looking for the town…</p>
      </div>
    </div>
    <noscript>
      <div class="no-script">
        <h1>San Junipero</h1>
        <p>
          A town of minds that live their own days, watched kindly. The people in it wake, work,
          fall out, build and remember on their own clock. The town writes down what happens, and
          you can read all of it.
        </p>
        <p>
          The town is drawn on a canvas and needs JavaScript to run.
          <a href="/sitemap.xml">Every page of the record</a> is listed for a reader that cannot.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
